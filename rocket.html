<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ракета</title>
  <style>
body { background: radial-gradient(circle at top, #3a0f6b, #0d0218 70%) !important; }
h1, .back, .balance span { color: #e3c4ff !important; text-shadow: 0 0 20px rgba(178,102,255,.8) !important; }
.balance { border-color: #b266ff !important; box-shadow: 0 0 15px rgba(178,102,255,.4) !important; background: #12031f !important; }
.screen { border-color: #7b3fd1 !important; background: #08010f !important; }
.controls input { border-color: #b266ff !important; background: #12031f !important; }
.quick button { border-color: #b266ff !important; color: #e3c4ff !important; background: #12031f !important; }
#action { background: linear-gradient(#b266ff, #6a1fc2) !important; box-shadow: 0 5px 0 #3a1170 !important; }
#action.cash { background: linear-gradient(#e08cff, #8a1fd6) !important; box-shadow: 0 5px 0 #4a1070 !important; }
#mult.crashed { color: #ff8ad8 !important; }
#mult.won { color: #e3b8ff !important; }
.history span { background: #2a1050 !important; color: #e3c4ff !important; }
.win { color: #e3b8ff !important; }
.lose { color: #ff8ad8 !important; }
#reset { background: #6a1fc2 !important; }
</style>
  <link rel="stylesheet" href="style.css">
  <style>
    .screen { position: relative; width: 100%; max-width: 360px; background: #08010f; border: 2px solid #7b3fd1; border-radius: 16px; overflow: hidden; }
    canvas { display: block; width: 100%; }
    #mult { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 50px; font-weight: bold; text-shadow: 0 0 15px #000; pointer-events: none; }
    #mult.crashed { color: #ff8ad8; }
    #mult.won { color: #e3b8ff; }
    .history { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 26px; }
    .history span { font-size: 13px; padding: 3px 8px; background: #2a1050; border-radius: 10px; }
    #go.cash { background: linear-gradient(#e08cff, #8a1fd6); }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Назад</a>
  <h1>Ракета</h1>
  <div class="balance">Фишки: <span id="balance"></span></div>
  <div class="history" id="history"></div>
  <div class="screen">
    <canvas id="canvas" width="360" height="240"></canvas>
    <div id="mult">1.00x</div>
  </div>
  <div class="message" id="message">Сделайте ставку и взлетайте!</div>
  <div class="row">
    <input type="number" id="bet" value="10" min="10" step="10">
    <input type="number" id="auto" placeholder="Авто-вывод (x)" min="1.01" step="0.1">
  </div>
  <button class="gold" id="go" style="width:220px">Старт</button>
  <button class="reset" id="reset">Получить 1000 фишек</button>
  <div class="note">Виртуальные фишки. Успейте забрать до взрыва!</div>

  <script src="common.js"></script>
  <script>
    const ctx = $('canvas').getContext('2d');
    const W = 360, H = 240;
    let flying = false, cashed = false, bet = 0, crashAt = 1, t0 = 0, mult = 1;
    let hist = JSON.parse(localStorage.getItem('rocketHistory') || '[]');

    function showHist() {
      $('history').innerHTML = hist.map(v =>
        '<span class="' + (v < 2 ? 'lose' : v < 10 ? '' : 'win') + '">' + v.toFixed(2) + 'x</span>'
      ).join('');
    }

    function genCrash() {
      const p = 0.97 / (1 - Math.random());
      return Math.max(1, Math.min(100, Math.floor(p * 100) / 100));
    }

    function draw(t, m, crashed) {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = 'rgba(178,102,255,0.12)';
      for (let i = 1; i < 6; i++) {
        ctx.beginPath(); ctx.moveTo(0, H / 6 * i); ctx.lineTo(W, H / 6 * i); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(W / 6 * i, 0); ctx.lineTo(W / 6 * i, H); ctx.stroke();
      }
      const mt = Math.max(6, t), mm = Math.max(2, m);
      const px = x => 20 + x / mt * (W - 60);
      const py = y => H - 20 - (y - 1) / (mm - 1) * (H - 60);
      ctx.beginPath(); ctx.moveTo(px(0), py(1));
      for (let i = 1; i <= 60; i++) {
        const tt = t / 60 * i;
        ctx.lineTo(px(tt), py(Math.exp(0.15 * tt)));
      }
      ctx.strokeStyle = crashed ? '#ff8ad8' : '#b266ff';
      ctx.lineWidth = 4; ctx.stroke();
      ctx.font = '34px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(crashed ? '💥' : '🚀', px(t), py(m));
    }

    function loop(now) {
      const t = (now - t0) / 1000;
      mult = Math.exp(0.15 * t);
      if (mult >= crashAt) return crash(t);
      const a = parseFloat($('auto').value);
      if (!cashed && a >= 1.01 && mult >= a) cash(a);
      $('mult').textContent = mult.toFixed(2) + 'x';
      draw(t, mult, false);
      requestAnimationFrame(loop);
    }

    function crash(t) {
      $('mult').textContent = crashAt.toFixed(2) + 'x';
      $('mult').className = 'crashed';
      draw(t, crashAt, true);
      hist.unshift(crashAt); hist = hist.slice(0, 10);
      localStorage.setItem('rocketHistory', JSON.stringify(hist));
      showHist();
      if (!cashed) say('💥 Взрыв на ' + crashAt.toFixed(2) + 'x. Ставка проиграна', 'lose');
      flying = false;
      $('go').textContent = 'Старт'; $('go').className = 'gold'; $('go').disabled = false;
      render();
    }

    function cash(at) {
      if (!flying || cashed) return;
      cashed = true;
      const m = at || mult;
      const w = Math.floor(bet * m);
      balance += w; render();
      $('mult').className = 'won';
      say('🎉 Вы забрали ' + w + ' (' + m.toFixed(2) + 'x)', 'win');
      $('go').textContent = 'Забрано!'; $('go').disabled = true;
    }

    $('go').onclick = () => {
      if (flying) return cash();
      const b = getBet();
      if (!b) return;
      bet = b; balance -= bet; render();
      flying = true; cashed = false;
      crashAt = genCrash();
      $('mult').className = '';
      say('Летим...');
      $('go').textContent = 'Забрать'; $('go').className = 'gold cash';
      t0 = performance.now();
      requestAnimationFrame(loop);
    };

    draw(0, 1, false);
    showHist();
  </script>
</body>
</html>
