<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Казино</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 24px; padding: 20px;
      background: radial-gradient(circle at top, #3a0f6b, #0d0218 70%);
      font-family: Arial, sans-serif;
    }
    h1 {
      font-size: 52px; color: #e3c4ff; text-transform: uppercase; letter-spacing: 8px;
      text-shadow: 0 0 25px rgba(178, 102, 255, 0.9);
    }
    .balance {
      font-size: 22px; color: #fff; background: #12031f;
      border: 2px solid #b266ff; border-radius: 12px; padding: 8px 24px;
      box-shadow: 0 0 15px rgba(178, 102, 255, 0.4);
    }
    .balance span { color: #e3c4ff; font-weight: bold; }
    .games { display: flex; flex-direction: column; gap: 14px; width: 80%; max-width: 320px; }
    .games a {
      display: block; text-align: center; padding: 16px; font-size: 22px;
      font-weight: bold; text-decoration: none; color: #e3c4ff;
      border: 2px solid #b266ff; border-radius: 14px; background: #12031f;
    }
    .games a:active { transform: scale(1.05); box-shadow: 0 0 25px rgba(178, 102, 255, 0.8); }
  </style>
</head>
<body>
  <h1>Казино</h1>
  <div class="balance">Фишки: <span id="balance">1000</span></div>
  <div class="games">
    <a href="casino.html">🎰 Слоты</a>
    <a href="rocket.html">🚀 Ракета</a>
    <a href="mines.html">💣 Мины</a>
    <a href="cups.html">🥤 Стаканчики</a>
    <a href="roulette.html">🎡 Рулетка</a>
    <a href="dice.html">🎲 Кости</a>
    <a href="coin.html">🪙 Орёл и решка</a>
    <a href="durak.html">🃏 Дурак</a>
  </div>

  <script>
    function showBalance() {
      let b = parseInt(localStorage.getItem('casinoBalance'));
      if (isNaN(b)) b = 1000;
      document.getElementById('balance').textContent = b;
    }
    showBalance();
    // обновляем при возврате назад из игры
    window.addEventListener('pageshow', showBalance);
  </script>
</body>
</html>
