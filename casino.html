<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Слоты</title>
  <style>
body { background: radial-gradient(circle at top, #3a0f6b, #0d0218 70%) !important; }
h1, .back, .balance span { color: #e3c4ff !important; text-shadow: 0 0 20px rgba(178,102,255,.8) !important; }
.balance { border-color: #b266ff !important; background: #12031f !important; }
.machine { background: linear-gradient(#8a3fe0, #3a1170) !important; box-shadow: 0 0 30px rgba(178,102,255,.5) !important; }
.bets button { border-color: #b266ff !important; color: #e3c4ff !important; background: #12031f !important; }
.bets button.active { background: #b266ff !important; color: #fff !important; }
#spin { background: linear-gradient(#b266ff, #6a1fc2) !important; box-shadow: 0 5px 0 #3a1170 !important; }
#reset { background: #6a1fc2 !important; }
.table { color: #c9b0e6 !important; }
.win { color: #e3b8ff !important; }
.lose { color: #ff8ad8 !important; }
</style>
  <link rel="stylesheet" href="style.css">
  <style>
    .machine { display: flex; gap: 10px; padding: 20px; background: linear-gradient(#8a3fe0, #3a1170); border-radius: 20px; box-shadow: 0 0 30px rgba(178, 102, 255, 0.5); }
    .reel { width: 90px; height: 110px; display: flex; align-items: center; justify-content: center; font-size: 60px; background: #fff; border-radius: 12px; box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5); }
    .table { font-size: 13px; color: #c9b0e6; text-align: center; line-height: 1.6; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Назад</a>
  <h1>Слоты</h1>
  <div class="balance">Фишки: <span id="balance"></span></div>
  <div class="machine">
    <div class="reel" id="r0">🍒</div>
    <div class="reel" id="r1">🍋</div>
    <div class="reel" id="r2">🔔</div>
  </div>
  <div class="message" id="message">Сделайте ставку и крутите!</div>
  <input type="number" id="bet" value="10" min="10" step="10">
  <button class="gold" onclick="spin()">Крутить</button>
  <button class="reset" id="reset">Получить 1000 фишек</button>
  <div class="table">
    Три одинаковых: 💎×20 · 7️⃣×15 · ⭐×10 · 🔔×8 · 🍋×5 · 🍒×4<br>
    Две одинаковых: ставка ×1.5
  </div>
  <div class="note">Виртуальные фишки, не реальные деньги.</div>

  <script src="common.js"></script>
  <script>
    const sy = ['🍒', '🍋', '🔔', '⭐', '7️⃣', '💎'];
    const mul = { '💎': 20, '7️⃣': 15, '⭐': 10, '🔔': 8, '🍋': 5, '🍒': 4 };
    let busy = false;
    const rnd = () => sy[Math.floor(Math.random() * sy.length)];

    function spin() {
      if (busy) return;
      const bet = getBet();
      if (!bet) return;
      busy = true;
      balance -= bet; render();
      say('Крутим...');
      const res = [rnd(), rnd(), rnd()];
      [0, 1, 2].forEach(i => {
        const el = $('r' + i);
        const t = setInterval(() => el.textContent = rnd(), 70);
        setTimeout(() => {
          clearInterval(t);
          el.textContent = res[i];
          if (i === 2) done(res, bet);
        }, 800 + i * 500);
      });
    }

    function done(r, bet) {
      let w = 0;
      if (r[0] === r[1] && r[1] === r[2]) w = bet * mul[r[0]];
      else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) w = Math.round(bet * 1.5);
      if (w > 0) { balance += w; say('🎉 Выигрыш: ' + w, 'win'); }
      else say('Не повезло, попробуйте ещё', 'lose');
      render(); busy = false;
    }
  </script>
</body>
</html>
