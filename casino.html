<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Казино — Слоты</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 20px;
      background: radial-gradient(circle at top, #2a0a3a, #111 70%);
      font-family: Arial, sans-serif;
      color: #fff;
    }

    .back {
      position: absolute;
      top: 15px;
      left: 15px;
      color: gold;
      text-decoration: none;
      font-size: 16px;
    }

    h1 {
      color: gold;
      letter-spacing: 6px;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .balance {
      font-size: 24px;
      background: #000;
      border: 2px solid gold;
      border-radius: 12px;
      padding: 8px 24px;
    }

    .balance span { color: gold; font-weight: bold; }

    .machine {
      display: flex;
      gap: 10px;
      padding: 20px;
      background: linear-gradient(#b8860b, #6b4e07);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
    }

    .reel {
      width: 90px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      background: #fff;
      border-radius: 12px;
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .reel.spinning { filter: blur(1.5px); }

    .message {
      min-height: 32px;
      font-size: 22px;
      font-weight: bold;
      text-align: center;
    }

    .win { color: #4cff6a; }
    .lose { color: #ff6b6b; }

    .bets { display: flex; gap: 10px; align-items: center; }

    .bets button {
      padding: 10px 16px;
      font-size: 16px;
      border: 2px solid gold;
      border-radius: 10px;
      background: #000;
      color: gold;
      cursor: pointer;
    }

    .bets button.active { background: gold; color: #000; font-weight: bold; }

    #spin, #reset {
      padding: 16px 50px;
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      border-radius: 14px;
      background: linear-gradient(#ff3b3b, #a80000);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 5px 0 #600;
    }

    #spin:active { transform: translateY(4px); box-shadow: 0 1px 0 #600; }
    #spin:disabled { opacity: 0.5; cursor: not-allowed; }
    #reset { display: none; font-size: 18px; padding: 12px 30px; }

    .table {
      font-size: 14px;
      color: #bbb;
      text-align: center;
      line-height: 1.6;
    }

    .note { font-size: 12px; color: #777; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← Назад</a>

  <h1>Слоты</h1>

  <div class="balance">Фишки: <span id="balance">1000</span></div>

  <div class="machine">
    <div class="reel" id="r0">🍒</div>
    <div class="reel" id="r1">🍋</div>
    <div class="reel" id="r2">🔔</div>
  </div>

  <div class="message" id="message">Сделайте ставку и крутите!</div>

  <div class="bets">
    Ставка:
    <button data-bet="10" class="active">10</button>
    <button data-bet="50">50</button>
    <button data-bet="100">100</button>
  </div>

  <button id="spin">Крутить</button>
  <button id="reset">Получить 1000 фишек</button>

  <div class="table">
    Три одинаковых: 💎×20 &nbsp; 7️⃣×15 &nbsp; ⭐×10 &nbsp; 🔔×8 &nbsp; 🍋×5 &nbsp; 🍒×4<br>
    Две одинаковых: ставка ×1.5
  </div>

  <div class="note">Игра на виртуальные фишки, не на реальные деньги.</div>

  <script>
    const symbols = ['🍒', '🍋', '🔔', '⭐', '7️⃣', '💎'];
    const multipliers = { '💎': 20, '7️⃣': 15, '⭐': 10, '🔔': 8, '🍋': 5, '🍒': 4 };

    let balance = parseInt(localStorage.getItem('casinoBalance')) || 1000;
    let bet = 10;
    let spinning = false;

    const balanceEl = document.getElementById('balance');
    const messageEl = document.getElementById('message');
    const spinBtn = document.getElementById('spin');
    const resetBtn = document.getElementById('reset');
    const reels = [0, 1, 2].map(i => document.getElementById('r' + i));
    const betButtons = document.querySelectorAll('.bets button');

    function randomSymbol() {
      return symbols[Math.floor(Math.random() * symbols.length)];
    }

    function updateBalance() {
      balanceEl.textContent = balance;
      localStorage.setItem('casinoBalance', balance);
      if (balance < 10) {
        spinBtn.style.display = 'none';
        resetBtn.style.display = 'inline-block';
        messageEl.className = 'message lose';
        messageEl.textContent = 'Фишки закончились!';
      } else {
        spinBtn.style.display = 'inline-block';
        resetBtn.style.display = 'none';
      }
    }

    betButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        if (spinning) return;
        bet = parseInt(btn.dataset.bet);
        betButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });

    spinBtn.addEventListener('click', () => {
      if (spinning) return;
      if (bet > balance) {
        messageEl.className = 'message lose';
        messageEl.textContent = 'Не хватает фишек для такой ставки';
        return;
      }

      spinning = true;
      spinBtn.disabled = true;
      balance -= bet;
      updateBalance();
      messageEl.className = 'message';
      messageEl.textContent = 'Крутим...';

      const results = [randomSymbol(), randomSymbol(), randomSymbol()];
      const stopTimes = [800, 1300, 1800];

      reels.forEach((reel, i) => {
        reel.classList.add('spinning');
        const timer = setInterval(() => {
          reel.textContent = randomSymbol();
        }, 70);

        setTimeout(() => {
          clearInterval(timer);
          reel.classList.remove('spinning');
          reel.textContent = results[i];
          if (i === 2) finish(results);
        }, stopTimes[i]);
      });
    });

    function finish(r) {
      let win = 0;

      if (r[0] === r[1] && r[1] === r[2]) {
        win = bet * multipliers[r[0]];
      } else if (r[0] === r[1] || r[1] === r[2] || r[0] === r[2]) {
        win = Math.round(bet * 1.5);
      }

      if (win > 0) {
        balance += win;
        messageEl.className = 'message win';
        messageEl.textContent = '🎉 Выигрыш: ' + win + ' фишек!';
      } else {
        messageEl.className = 'message lose';
        messageEl.textContent = 'Не повезло, попробуйте ещё';
      }

      spinning = false;
      spinBtn.disabled = false;
      updateBalance();
    }

    resetBtn.addEventListener('click', () => {
      balance = 1000;
      messageEl.className = 'message';
      messageEl.textContent = 'Сделайте ставку и крутите!';
      updateBalance();
    });

    updateBalance();
  </script>
</body>
</html>
